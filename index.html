<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Time Tracker</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
      background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      min-height:100vh;
      padding:12px;
      color:#111827;
    }
    .container{max-width:900px;margin:0 auto}
    .card{
      background:#fff;border-radius:22px;padding:24px;margin:18px auto;
      box-shadow:0 20px 60px rgba(0,0,0,.28)
    }
    h1{font-size:28px;text-align:center;margin-bottom:16px;color:#111827}
    h3{font-size:16px;color:#111827;margin-bottom:10px}
    .muted{color:#6b7280;font-size:13px}
    .divider{height:1px;background:#eef2f7;margin:18px 0}

    /* top header */
    .topbar{
      display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;
      margin-bottom:14px
    }
    .who{display:flex;flex-direction:column;gap:2px}
    .who strong{font-size:14px}
    .pill-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .pill{
      background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;
      padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center
    }
    .pill input[type="month"]{border:none;background:transparent;padding:0;font-size:13px;width:auto}

    /* tabs */
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .tab{
      flex:1;min-width:110px;padding:12px;background:#e2e8f0;border:none;border-radius:12px;
      font-size:14px;font-weight:800;cursor:pointer;transition:.15s
    }
    .tab.active{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
    .section{display:none}
    .section.active{display:block}

    /* forms */
    .form-group{margin-bottom:14px}
    label{display:block;font-weight:800;color:#374151;margin-bottom:6px;font-size:13px}
    input,select,textarea{
      width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:12px;
      font-size:15px;font-family:inherit
    }
    textarea{resize:vertical;min-height:70px}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#667eea}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

    /* buttons */
    .btn{
      width:100%;padding:14px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;
      transition:transform .15s
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .btn-secondary{background:#10b981}
    .btn-ghost{background:#f8fafc;color:#111827;border:1px solid #e5e7eb}
    .btn-danger{background:#ef4444;color:#fff;border:none}
    .btn-small{
      width:auto;padding:8px 12px;border-radius:12px;font-size:12px;font-weight:900
    }
    .btn-group{display:flex;gap:10px;flex-wrap:wrap}
    .btn-chip{
      width:auto;padding:10px 12px;border-radius:999px;font-size:12px;font-weight:900;
      border:1px solid #e5e7eb;background:#f8fafc;color:#111827;cursor:pointer
    }
    .btn-chip:active{transform:scale(.98)}

    /* activities */
    .activities-grid{
      display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px
    }
    .activity-card{
      padding:14px 10px;border-radius:14px;text-align:center;cursor:pointer;
      color:#fff;font-weight:900;font-size:13px;border:3px solid transparent;
      transition:.15s
    }
    .activity-card:hover{transform:translateY(-2px);box-shadow:0 10px 18px rgba(0,0,0,.18)}
    .activity-card.selected{border-color:#111827;transform:scale(1.03)}

    /* panels */
    .panel{
      background:#f8fafc;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:14px
    }
    .panel-head{
      display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px
    }
    .panel-head .title{font-weight:1000}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
    .kpi{
      background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px
    }
    .kpi .v{font-size:18px;font-weight:1000}
    .kpi .l{font-size:12px;color:#6b7280;margin-top:4px}

    /* logs list */
    .log-card{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:12px;border-radius:16px;background:#f7fafc;border:1px solid #edf2f7;
      margin-bottom:10px
    }
    .log-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
    .dot{width:18px;height:18px;border-radius:50%;flex-shrink:0}
    .log-text{min-width:0}
    .log-title{font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .log-sub{font-size:12px;color:#6b7280;margin-top:2px}
    .log-right{text-align:right;flex-shrink:0}
    .log-dur{font-weight:1000}
    .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}

    /* finance banking UI */
    .bank-card{
      border-radius:18px;padding:18px;color:#fff;
      background:linear-gradient(135deg,rgba(102,126,234,1) 0%,rgba(118,75,162,1) 100%);
      box-shadow:0 10px 25px rgba(0,0,0,.18);margin-bottom:16px
    }
    .bank-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
    .bank-title{font-size:12px;opacity:.85}
    .bank-balance{font-size:34px;font-weight:1000;line-height:1.1;margin-top:4px}
    .bank-sub{font-size:12px;opacity:.85;margin-top:6px}
    .bank-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .bank-metric{
      background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);
      padding:12px;border-radius:16px
    }
    .bank-metric .label{font-size:11px;opacity:.85}
    .bank-metric .value{font-size:16px;font-weight:1000;margin-top:6px}

    .txn{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      padding:12px;border-radius:16px;background:#f7fafc;border:1px solid #edf2f7;margin-bottom:10px
    }
    .txn-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
    .txn-icon{
      width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;
      font-weight:1000;flex-shrink:0
    }
    .txn-icon.income{background:#d1fae5;color:#065f46}
    .txn-icon.expense{background:#fee2e2;color:#991b1b}
    .txn-text{min-width:0}
    .txn-desc{font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .txn-meta{font-size:12px;color:#6b7280;margin-top:3px}
    .txn-right{text-align:right;flex-shrink:0}
    .txn-amt{font-weight:1000;font-size:14px}
    .txn-amt.income{color:#10b981}
    .txn-amt.expense{color:#ef4444}

    /* settings */
    .settings-grid{display:grid;grid-template-columns:1fr;gap:14px}
    .setting-block{background:#f8fafc;border:1px solid #e5e7eb;border-radius:18px;padding:16px}
    .setting-block h4{font-size:14px;font-weight:1000;margin-bottom:6px}
    .setting-block .muted{margin-bottom:12px}
    .activity-edit-row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
    .activity-edit-row input[type="color"]{width:62px;height:40px;border:none;border-radius:10px;padding:0;cursor:pointer}
    .activity-edit-row input[type="text"]{flex:1}

    /* modal */
    .modal-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.45);
      display:flex;align-items:center;justify-content:center;padding:14px;z-index:50
    }
    .modal{
      background:#fff;border-radius:18px;max-width:520px;width:100%;
      padding:16px;border:1px solid #e5e7eb;box-shadow:0 30px 70px rgba(0,0,0,.35)
    }
    .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
    .modal-title{font-weight:1000}
    .xbtn{border:none;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:12px;padding:8px 10px;cursor:pointer;font-weight:1000}

    canvas{max-width:100%;height:auto !important}

    @media (max-width: 680px){
      .activities-grid{grid-template-columns:repeat(2,1fr)}
      .row{grid-template-columns:1fr}
      .bank-balance{font-size:30px}
      .tab{min-width:90px}
    }
  </style>
</head>

<body>
  <div class="container" id="app"></div>

  <!-- IMPORTANT: UMD build (fixes GitHub Pages blank screen issue) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script>
    // ====== YOUR SUPABASE ======
    const SUPABASE_URL = 'https://hvcqhlcaqocrqlyshzxm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2Y3FobGNhcW9jcnFseXNoenhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1NzcyNjcsImV4cCI6MjA4MzE1MzI2N30.E0VoHgQ6UevXqiYJyWtvYqBPwvmGbBw_jkzTlQMm4KQ';

    // ====== default activities ======
    const DEFAULT_ACTIVITIES = [
      { name: 'Work', color: '#3b82f6' },
      { name: 'Sleep', color: '#8b5cf6' },
      { name: 'Exercise', color: '#10b981' },
      { name: 'Study', color: '#f59e0b' },
      { name: 'Social', color: '#ec4899' },
      { name: 'Entertainment', color: '#06b6d4' },
      { name: 'Cooking', color: '#84cc16' },
      { name: 'Commute', color: '#6366f1' },
      { name: 'Chores', color: '#14b8a6' },
      { name: 'Reading', color: '#f97316' },
      { name: 'Hobbies', color: '#a855f7' },
      { name: 'Family', color: '#ef4444' },
      { name: 'Shopping', color: '#eab308' },
      { name: 'Health', color: '#22c55e' },
      { name: 'Other', color: '#64748b' }
    ];

    // ====== preferences (local only) ======
    const PREFS_KEY = 'tt_prefs_v1';
    function loadPrefs() {
      try {
        const raw = localStorage.getItem(PREFS_KEY);
        if (!raw) return { currency: 'EUR', timeFormat: '24' };
        const p = JSON.parse(raw);
        return { currency: p.currency || 'EUR', timeFormat: p.timeFormat || '24' };
      } catch { return { currency: 'EUR', timeFormat: '24' }; }
    }
    function savePrefs(next) { localStorage.setItem(PREFS_KEY, JSON.stringify(next)); }
    let prefs = loadPrefs();

    function moneyFmt() { return new Intl.NumberFormat(undefined, { style:'currency', currency: prefs.currency }); }
    function fmtMoney(n) { return moneyFmt().format(Number(n || 0)); }

    function timeTo12h(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hh = ((h + 11) % 12) + 1;
      return `${hh}:${String(m).padStart(2,'0')} ${ampm}`;
    }
    function fmtTime(hhmm) { return prefs.timeFormat === '12' ? timeTo12h(hhmm) : hhmm; }

    // ====== auth: username -> fake email ======
    function usernameToEmail(username) {
      const clean = username.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
      return `${clean}@example.com`;
    }

    // ====== global client (safe init) ======
    let supabaseClient = null;

    function renderFatalError(title, details) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="card" style="max-width:560px;margin:60px auto;">
          <h1>⏰ Time Tracker</h1>
          <p class="muted" style="text-align:center;margin-top:10px;"><strong>${escapeHtml(title)}</strong></p>
          <div class="divider"></div>
          <pre style="white-space:pre-wrap;background:#0b1220;color:#e5e7eb;padding:12px;border-radius:14px;overflow:auto;font-size:12px;">${escapeHtml(details || '')}</pre>
          <div class="divider"></div>
          <p class="muted" style="text-align:center;">If you're on a restricted network, CDNs may be blocked.</p>
        </div>
      `;
    }

    function createSupabaseClientOrShowError() {
      if (!window.supabase || !window.supabase.createClient) {
        renderFatalError(
          'Supabase library did not load',
          'Fix: keep this script tag:\nhttps://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js\n\nThen hard refresh (Ctrl+Shift+R).'
        );
        return null;
      }
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // ====== APP STATE ======
    let currentUser = null; // { id, username }
    let activities = [];
    let logs = [];
    let finances = [];
    let selectedActivity = null;

    let currentTab = 'log';
    let chartInstance = null;

    let selectedMonth = new Date().toISOString().slice(0, 7); // YYYY-MM
    let logDateState = getTodayString();
    let startTimeState = getCurrentTime();
    let endTimeState = getCurrentTime();
    let financeDateState = getTodayString();

    let showArchivedActivities = false;

    // Modals
    let editLogId = null;
    let editLogDraft = null;
    let changePassOpen = false;
    let renameOpen = false;

    // ====== INIT (never blank) ======
    function boot() {
      // Always show sign-in UI immediately
      renderAuth();

      supabaseClient = createSupabaseClientOrShowError();
      if (!supabaseClient) return;

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeAllModals();
      });

      init().catch(err => {
        console.error(err);
        renderAuth();
        showAuthMessage('error', err?.message || 'Init failed');
      });
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (session?.user) {
        await hydrateUser(session.user);
        await ensureSeedActivities();
        await loadActivities();
        await loadMonthData(selectedMonth);
        renderApp();
      } else {
        renderAuth();
      }

      supabaseClient.auth.onAuthStateChange(async (_event, session2) => {
        try {
          if (session2?.user) {
            await hydrateUser(session2.user);
            await ensureSeedActivities();
            await loadActivities();
            await loadMonthData(selectedMonth);
            renderApp();
          } else {
            currentUser = null;
            activities = [];
            logs = [];
            finances = [];
            selectedActivity = null;
            closeAllModals(true);
            renderAuth();
          }
        } catch (e) {
          console.error(e);
          renderAuth();
          showAuthMessage('error', e?.message || 'Auth state error');
        }
      });
    }

    // Hard crash guard -> shows a useful screen instead of blank
    window.addEventListener('error', (e) => {
      console.error('Window error:', e.error || e.message);
      // If user is already seeing UI, don't overwrite it unless it's blank
      const app = document.getElementById('app');
      if (app && app.innerHTML.trim().length < 10) {
        renderFatalError('JavaScript crashed', (e.error && e.error.stack) ? e.error.stack : String(e.message || e));
      }
    });

    // ====== MODALS ======
    function closeAllModals(noRender) {
      editLogId = null;
      editLogDraft = null;
      changePassOpen = false;
      renameOpen = false;
      if (!noRender && currentUser) renderApp();
    }

    // ====== PROFILE ======
    async function hydrateUser(user) {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('username')
        .eq('id', user.id)
        .maybeSingle();

      if (error && error.code !== 'PGRST116') {
        // PGRST116 = no rows (depends on supabase/postgrest)
        console.warn(error);
      }

      const username = data?.username || 'user';
      currentUser = { id: user.id, username };
    }

    // ====== AUTH UI ======
    function renderAuth() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="card" style="max-width:460px;margin:60px auto;">
          <h1>⏰ Time Tracker</h1>
          <p class="muted" style="text-align:center;margin-bottom:18px;">
            Username + password login (no real email needed)
          </p>
          <div id="authMessage"></div>
          <div id="authForm"></div>
        </div>
      `;
      showSignInForm();
    }

    function showAuthMessage(type, text) {
      const el = document.getElementById('authMessage');
      if (!el) return;
      el.innerHTML = `
        <div style="padding:12px;border-radius:12px;margin-bottom:12px;text-align:center;
                    background:${type==='error' ? '#fee2e2' : '#dcfce7'};
                    color:${type==='error' ? '#991b1b' : '#166534'};
                    border:1px solid ${type==='error' ? '#fecaca' : '#bbf7d0'};">
          ${escapeHtml(text)}
        </div>`;
    }

    function showSignInForm() {
      document.getElementById('authForm').innerHTML = `
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Your username" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
        </div>
        <button class="btn" onclick="handleSignIn()">Sign In</button>
        <button class="btn btn-ghost" style="margin-top:10px;" onclick="showSignUpForm()">Create account</button>
      `;
      setTimeout(() => document.getElementById('username')?.focus(), 50);
    }

    function showSignUpForm() {
      document.getElementById('authForm').innerHTML = `
        <div class="form-group">
          <label>Choose username</label>
          <input type="text" id="username" placeholder="Pick a username" autocomplete="username">
        </div>
        <div class="form-group">
          <label>Choose password</label>
          <input type="password" id="password" placeholder="Min 6 characters" autocomplete="new-password">
        </div>
        <button class="btn" onclick="handleSignUp()">Create account</button>
        <button class="btn btn-ghost" style="margin-top:10px;" onclick="showSignInForm()">Back to sign in</button>
      `;
      setTimeout(() => document.getElementById('username')?.focus(), 50);
    }

    async function handleSignUp() {
      const username = (document.getElementById('username')?.value || '').trim();
      const password = document.getElementById('password')?.value || '';

      if (username.length < 3) return showAuthMessage('error', 'Username must be at least 3 characters');
      if (password.length < 6) return showAuthMessage('error', 'Password must be at least 6 characters');

      const email = usernameToEmail(username);

      showAuthMessage('success', 'Creating account...');

      // 1) create auth account
      const { error: upErr } = await supabaseClient.auth.signUp({ email, password });
      if (upErr) return showAuthMessage('error', upErr.message);

      // 2) sign in to get a session (so RLS allows profile insert)
      const { data: signInData, error: inErr } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (inErr) return showAuthMessage('error', inErr.message);

      // 3) create profile
      const user = signInData?.user;
      if (user) {
        const { error: pErr } = await supabaseClient
          .from('profiles')
          .insert({ id: user.id, username });

        // If username already taken (unique constraint), show a clean message
        if (pErr) {
          if (String(pErr.message || '').toLowerCase().includes('duplicate')) {
            await supabaseClient.auth.signOut();
            return showAuthMessage('error', 'Username already taken. Pick another.');
          }
          await supabaseClient.auth.signOut();
          return showAuthMessage('error', pErr.message);
        }
      }

      // onAuthStateChange will render app
    }

    async function handleSignIn() {
      const username = (document.getElementById('username')?.value || '').trim();
      const password = document.getElementById('password')?.value || '';
      if (!username || !password) return showAuthMessage('error', 'Username and password required');

      const email = usernameToEmail(username);
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) return showAuthMessage('error', error.message);
      // onAuthStateChange will render app
    }

    async function handleSignOut() {
      await supabaseClient.auth.signOut();
    }

    // ====== DATA ======
    async function ensureSeedActivities() {
      const { data, error } = await supabaseClient
        .from('activities')
        .select('id')
        .eq('user_id', currentUser.id)
        .limit(1);

      if (error) return console.error(error);

      if (!data || data.length === 0) {
        const rows = DEFAULT_ACTIVITIES.map(a => ({
          user_id: currentUser.id,
          name: a.name,
          color: a.color,
          is_active: true
        }));
        const { error: insErr } = await supabaseClient.from('activities').insert(rows);
        if (insErr) console.error(insErr);
      }
    }

    async function loadActivities() {
      let q = supabaseClient.from('activities').select('*').eq('user_id', currentUser.id);
      if (!showArchivedActivities) q = q.eq('is_active', true);
      const { data, error } = await q.order('name', { ascending: true });
      if (error) throw error;

      activities = data || [];
      if (selectedActivity) selectedActivity = activities.find(a => a.id === selectedActivity.id) || null;
    }

    function monthRange(yyyyMm) {
      const [y, m] = yyyyMm.split('-').map(Number);
      const start = new Date(Date.UTC(y, m - 1, 1)).toISOString().slice(0, 10);
      const end = new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 10);
      return { start, end };
    }

    async function loadLogsForMonth(yyyyMm) {
      const { start, end } = monthRange(yyyyMm);
      const { data, error } = await supabaseClient
        .from('logs')
        .select('*')
        .eq('user_id', currentUser.id)
        .gte('log_date', start)
        .lt('log_date', end)
        .order('log_date', { ascending: false })
        .order('start_time', { ascending: false });
      if (error) throw error;
      logs = data || [];
    }

    async function loadFinancesForMonth(yyyyMm) {
      const { start, end } = monthRange(yyyyMm);
      const { data, error } = await supabaseClient
        .from('finances')
        .select('*')
        .eq('user_id', currentUser.id)
        .gte('date', start)
        .lt('date', end)
        .order('date', { ascending: false })
        .order('created_at', { ascending: false });
      if (error) throw error;
      finances = data || [];
    }

    async function loadMonthData(yyyyMm) {
      await Promise.all([loadLogsForMonth(yyyyMm), loadFinancesForMonth(yyyyMm)]);
    }

    // ====== Time overlap helpers ======
    function timeToMinutes(hhmm) {
      const [h,m] = hhmm.split(':').map(Number);
      return h*60 + m;
    }
    function crossesMidnight(start, end) {
  return timeToMinutes(end) < timeToMinutes(start);
}

function addDays(dateStr, days) {
  // dateStr = "YYYY-MM-DD"
  const d = new Date(dateStr + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

// inserts ONE log row (no splitting)
async function insertLogRow({ activity, date, startTime, endTime }) {
  const duration = calculateDuration(startTime, endTime);

  const { error } = await supabaseClient.from("logs").insert({
    user_id: currentUser.id,
    activity_name: activity.name,
    activity_color: activity.color,
    log_date: date,
    start_time: startTime,
    end_time: endTime,
    duration
  });

  if (error) throw error;
}

// inserts log, splitting if it crosses midnight
async function addLogSmart(activity, date, startTime, endTime) {
  if (!crossesMidnight(startTime, endTime)) {
    await insertLogRow({ activity, date, startTime, endTime });
    return;
  }

  // Split across midnight:
  const nextDate = addDays(date, 1);

  // Part 1: date startTime -> 00:00
  await insertLogRow({ activity, date, startTime, endTime: "00:00" });

  // Part 2: nextDate 00:00 -> endTime (only if endTime isn't exactly midnight)
  if (endTime !== "00:00") {
    await insertLogRow({ activity, date: nextDate, startTime: "00:00", endTime });
  }
}

    function segmentsFor(start, end) {
      const s = timeToMinutes(start);
      const e = timeToMinutes(end);
      if (e > s) return [[s,e]];
      if (e < s) return [[s,1440],[0,e]];
      return [];
    }
    function overlaps(a, b) { return a[0] < b[1] && b[0] < a[1]; }
    function hasOverlap(date, start, end, excludeId) {
      const segA = segmentsFor(start,end);
      if (segA.length === 0) return false;
      const sameDay = logs.filter(l => l.log_date === date && (excludeId ? l.id !== excludeId : true));
      for (const l of sameDay) {
        const segB = segmentsFor(l.start_time, l.end_time);
        for (const sa of segA) for (const sb of segB) {
          if (overlaps(sa,sb)) return true;
        }
      }
      return false;
    }

    // ====== CRUD ======
    function calculateDuration(startTime, endTime) {
      const s = timeToMinutes(startTime);
      const e = timeToMinutes(endTime);
      let mins = e - s;
      if (mins < 0) mins += 1440;
      return (mins / 60).toFixed(2);
    }

    // ====== helpers ======
    function getTodayString(){ return new Date().toISOString().split('T')[0]; }
    function getCurrentTime(){
      const now = new Date();
      return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }
    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, s => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[s]));
    }

    function getTimeStats() {
      const totals = {};
      logs.forEach(l => { totals[l.activity_name] = (totals[l.activity_name] || 0) + parseFloat(l.duration || 0); });
      return Object.entries(totals).map(([name, hours]) => ({
        name,
        hours: parseFloat(hours.toFixed(1)),
        color: logs.find(x => x.activity_name === name)?.activity_color || '#64748b'
      })).sort((a,b) => b.hours - a.hours);
    }

    function getFinanceStats(){
      let income=0, expense=0;
      finances.forEach(f => {
        const amt = parseFloat(f.amount || 0);
        if (f.type === 'income') income += amt;
        else expense += amt;
      });
      return { income, expense, balance: income - expense };
    }

    function dayTotals(date){
      const dayLogs = logs.filter(l => l.log_date === date);
      const total = dayLogs.reduce((s,l) => s + parseFloat(l.duration || 0), 0);
      return { count: dayLogs.length, hours: total };
    }

    function getLastLogEnd(date){
      const dayLogs = logs.filter(l => l.log_date === date).slice().sort((a,b)=>{
        if (a.start_time < b.start_time) return 1;
        if (a.start_time > b.start_time) return -1;
        return 0;
      });
      return dayLogs[0]?.end_time || null;
    }

    function addMinutesToTime(hhmm, minutes){
      let m = timeToMinutes(hhmm);
      m = (m + minutes) % 1440;
      const h = Math.floor(m/60);
      const mm = m % 60;
      return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
    }

    // exports
    function csvEscape(v){
      const s = String(v ?? '');
      if (/[,"\n]/.test(s)) return `"${s.replace(/"/g,'""')}"`;
      return s;
    }
    function downloadBlob(content, filename, mime){
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download=filename; a.click();
      URL.revokeObjectURL(url);
    }

    async function handleAddLog() {
  if (!selectedActivity) return alert("Select an activity first.");
  if (startTimeState === endTimeState) return alert("Start and end time cannot be the same.");

  try {
    if (!crossesMidnight(startTimeState, endTimeState)) {
      // normal same-day overlap check
      if (hasOverlap(logDateState, startTimeState, endTimeState, null)) {
        return alert("This overlaps with an existing entry for the same day.");
      }
    } else {
      // overnight: check BOTH days
      const nextDate = addDays(logDateState, 1);

      // overlap on day 1: start -> 00:00
      if (hasOverlap(logDateState, startTimeState, "00:00", null)) {
        return alert("This overlaps with an existing entry on the start day.");
      }

      // overlap on day 2: 00:00 -> end
      if (endTimeState !== "00:00" && hasOverlap(nextDate, "00:00", endTimeState, null)) {
        return alert("This overlaps with an existing entry on the next day.");
      }
    }

    // ✅ insert with auto-split
    await addLogSmart(selectedActivity, logDateState, startTimeState, endTimeState);

    const m = logDateState.slice(0, 7);
    if (m !== selectedMonth) selectedMonth = m;

    await loadMonthData(selectedMonth);
    renderApp();
  } catch (e) {
    alert("Error adding log: " + e.message);
  }
}

              <div class="bank-sub">${escapeHtml(currentUser.username)}</div>
            </div>
          </div>

          <div class="bank-metrics">
            <div class="bank-metric">
              <div class="label">Income</div>
              <div class="value">${escapeHtml(fmtMoney(f.income))}</div>
            </div>
            <div class="bank-metric">
              <div class="label">Spent</div>
              <div class="value">${escapeHtml(fmtMoney(f.expense))}</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <div class="title">New transaction</div>
              <div class="muted">Simple + clean like a banking feed.</div>
            </div>
            <div class="btn-group">
              <button class="btn-small btn-secondary" onclick="exportFinanceCSV()">Export CSV</button>
            </div>
          </div>

          <div class="row">
            <div class="form-group">
              <label>Type</label>
              <select id="financeType">
                <option value="income">Income</option>
                <option value="expense" selected>Expense</option>
              </select>
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="financeDate" value="${financeDateState}" onchange="setFinanceDate(this.value)">
            </div>
          </div>

          <div class="row">
            <div class="form-group">
              <label>Amount (${escapeHtml(prefs.currency)})</label>
              <input type="number" id="financeAmount" placeholder="0.00" step="0.01" min="0">
            </div>
            <div class="form-group">
              <label>Merchant / note</label>
              <input type="text" id="financeDescription" placeholder="e.g., Groceries, Salary, Netflix">
            </div>
          </div>

          <button class="btn" onclick="handleAddFinance()">Add transaction</button>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <div class="title">Transactions</div>
              <div class="muted">${selectedMonth} • ${finances.length} items</div>
            </div>
          </div>

          ${finances.length ? finances.slice(0,30).map(fx => `
            <div class="txn">
              <div class="txn-left">
                <div class="txn-icon ${fx.type}">${fx.type === 'income' ? '+' : '−'}</div>
                <div class="txn-text">
                  <div class="txn-desc">${escapeHtml(fx.description || (fx.type==='income' ? 'Income' : 'Expense'))}</div>
                  <div class="txn-meta">${fx.date} • ${fx.type}</div>
                </div>
              </div>
              <div class="txn-right">
                <div class="txn-amt ${fx.type}">
                  ${fx.type==='income' ? '+' : '-'}${escapeHtml(fmtMoney(parseFloat(fx.amount)))}
                </div>
                <div style="margin-top:8px;">
                  <button class="btn-small btn-danger" onclick="deleteFinance(${fx.id})">Delete</button>
                </div>
              </div>
            </div>
          `).join('') : `<div class="muted" style="text-align:center;padding:14px;">No transactions this month.</div>`}
        </div>
      `;
    }

    function renderStatsSection(){
      const stats = getTimeStats();
      const totalHours = stats.reduce((s,x)=>s+x.hours,0);
      const f = getFinanceStats();

      return `
        <div class="panel">
          <div class="panel-head">
            <div>
              <div class="title">Monthly overview</div>
              <div class="muted">Time distribution + finance summary for ${selectedMonth}.</div>
            </div>
            <div class="btn-group">
              <button class="btn-small btn-secondary" onclick="exportTimeCSV()">Export time CSV</button>
            </div>
          </div>

          <div class="kpis">
            <div class="kpi"><div class="v">${logs.length}</div><div class="l">Time entries</div></div>
            <div class="kpi"><div class="v">${totalHours.toFixed(1)}h</div><div class="l">Hours logged</div></div>
            <div class="kpi"><div class="v">${escapeHtml(fmtMoney(f.balance))}</div><div class="l">Balance</div></div>
          </div>

          <div class="divider"></div>

          ${stats.length ? `
            <div class="chart-container"><canvas id="statsChart"></canvas></div>
            <div style="margin-top:16px;">
              ${stats.map(s => `
                <div class="log-card">
                  <div class="log-left">
                    <div class="dot" style="background:${s.color}"></div>
                    <div class="log-text">
                      <div class="log-title">${escapeHtml(s.name)}</div>
                      <div class="log-sub">Monthly total</div>
                    </div>
                  </div>
                  <div class="log-right"><div class="log-dur">${s.hours}h</div></div>
                </div>
              `).join('')}
            </div>
          ` : `<div class="muted" style="text-align:center;padding:14px;">No time data for this month.</div>`}
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <div class="title">Finance summary</div>
              <div class="muted">${selectedMonth}</div>
            </div>
            <div class="btn-group">
              <button class="btn-small btn-secondary" onclick="exportFinanceCSV()">Export finance CSV</button>
            </div>
          </div>

          <div class="kpis">
            <div class="kpi"><div class="v" style="color:#059669">${escapeHtml(fmtMoney(f.income))}</div><div class="l">Income</div></div>
            <div class="kpi"><div class="v" style="color:#dc2626">${escapeHtml(fmtMoney(f.expense))}</div><div class="l">Expenses</div></div>
            <div class="kpi"><div class="v">${escapeHtml(fmtMoney(f.balance))}</div><div class="l">Balance</div></div>
          </div>
        </div>
      `;
    }

    function renderSettingsSection(){
      return `
        <div class="settings-grid">

          <div class="setting-block">
            <h4>Profile</h4>
            <div class="muted">Manage your username and security.</div>

            <div class="row">
              <div class="panel" style="margin:0;">
                <div class="muted">Username</div>
                <div style="font-weight:1000;font-size:16px;margin-top:4px;">${escapeHtml(currentUser.username)}</div>
                <div class="btn-group" style="margin-top:10px;">
                  <button class="btn-small btn-ghost" onclick="openRename()">Change username</button>
                  <button class="btn-small btn-ghost" onclick="openChangePassword()">Change password</button>
                </div>
              </div>

              <div class="panel" style="margin:0;">
                <div class="muted">Session</div>
                <div style="font-weight:1000;font-size:16px;margin-top:4px;">Signed in</div>
                <div class="btn-group" style="margin-top:10px;">
                  <button class="btn-small btn-danger" onclick="if(confirm('Sign out?')) handleSignOut()">Sign out</button>
                </div>
              </div>
            </div>
          </div>

          <div class="setting-block">
            <h4>Preferences</h4>
            <div class="muted">Local UI settings (stored in your browser only).</div>

            <div class="row">
              <div class="form-group" style="margin:0;">
                <label>Currency</label>
                <select onchange="setPrefCurrency(this.value)">
                  ${['EUR','USD','GBP','INR'].map(c => `<option value="${c}" ${prefs.currency===c?'selected':''}>${c}</option>`).join('')}
                </select>
                <div class="muted" style="margin-top:6px;">Affects finance display + exports.</div>
              </div>

              <div class="form-group" style="margin:0;">
                <label>Time display</label>
                <select onchange="setPrefTimeFormat(this.value)">
                  <option value="24" ${prefs.timeFormat==='24'?'selected':''}>24-hour (14:30)</option>
                  <option value="12" ${prefs.timeFormat==='12'?'selected':''}>12-hour (2:30 PM)</option>
                </select>
                <div class="muted" style="margin-top:6px;">Does not change what is stored in DB.</div>
              </div>
            </div>
          </div>

          <div class="setting-block">
            <h4>Activities</h4>
            <div class="muted">Rename, recolor, archive and restore. Archived activities don’t appear in the Time tab.</div>

            <div class="btn-group" style="margin-bottom:12px;">
              <button class="btn-small btn-secondary" onclick="addNewActivity()">+ Add activity</button>
              <button class="btn-small btn-ghost" onclick="toggleArchived()">${showArchivedActivities ? 'Hide archived' : 'Show archived'}</button>
            </div>

            ${activities.length ? activities.map(a => `
              <div class="activity-edit-row">
                <input type="color" value="${a.color}" id="color_${a.id}" onchange="updateActivityField(${a.id})">
                <input type="text" value="${escapeHtml(a.name)}" id="name_${a.id}" onchange="updateActivityField(${a.id})">
                ${
                  a.is_active === false
                    ? `<button class="btn-small btn-secondary" onclick="unarchiveActivity(${a.id})">Restore</button>`
                    : `<button class="btn-small btn-danger" onclick="archiveActivity(${a.id})">Archive</button>`
                }
              </div>
            `).join('') : `<div class="muted" style="text-align:center;padding:14px;">No activities.</div>`}
          </div>

          <div class="setting-block">
            <h4>Data & exports</h4>
            <div class="muted">Download your data anytime.</div>

            <div class="btn-group">
              <button class="btn-small btn-secondary" onclick="exportTimeCSV()">Export time CSV</button>
              <button class="btn-small btn-secondary" onclick="exportFinanceCSV()">Export finance CSV</button>
            </div>
          </div>

          <div class="setting-block" style="border-color:#fecaca;background:#fff7f7;">
            <h4>Danger zone</h4>
            <div class="muted">These actions cannot be undone.</div>

            <div class="btn-group">
              <button class="btn-small btn-danger" onclick="deleteAllMyData()">Delete ALL my data</button>
            </div>
          </div>

        </div>
      `;
    }

    function renderModals(){
      let html = '';

      if (editLogId && editLogDraft){
        const actOptions = activities
          .filter(a => a.is_active !== false)
          .map(a => `<option value="${a.id}" ${String(a.id)===String(editLogDraft.activityId)?'selected':''}>${escapeHtml(a.name)}</option>`)
          .join('');

        html += `
          <div class="modal-overlay" onclick="closeAllModals()">
            <div class="modal" onclick="event.stopPropagation()">
              <div class="modal-head">
                <div>
                  <div class="modal-title">Edit time entry</div>
                  <div class="muted">Adjust date, time, or activity. Overlaps are blocked.</div>
                </div>
                <button class="xbtn" onclick="closeAllModals()">✕</button>
              </div>

              <div class="form-group">
                <label>Activity</label>
                <select id="editActivity">
                  <option value="">(keep: ${escapeHtml(editLogDraft.activityName)})</option>
                  ${actOptions}
                </select>
              </div>

              <div class="row">
                <div class="form-group">
                  <label>Date</label>
                  <input id="editDate" type="date" value="${editLogDraft.date}">
                </div>
                <div class="form-group">
                  <label>Start</label>
                  <input id="editStart" type="time" value="${editLogDraft.start}">
                </div>
              </div>

              <div class="row">
                <div class="form-group">
                  <label>End</label>
                  <input id="editEnd" type="time" value="${editLogDraft.end}">
                </div>
                <div class="form-group">
                  <label>Preview duration</label>
                  <input type="text" value="${calculateDuration(editLogDraft.start, editLogDraft.end)}h" disabled>
                </div>
              </div>

              <div class="btn-group">
                <button class="btn btn-ghost" onclick="closeAllModals()">Cancel</button>
                <button class="btn" onclick="saveEditLog()">Save changes</button>
              </div>
            </div>
          </div>
        `;
      }

      if (renameOpen){
        html += `
          <div class="modal-overlay" onclick="closeAllModals()">
            <div class="modal" onclick="event.stopPropagation()">
              <div class="modal-head">
                <div>
                  <div class="modal-title">Change username</div>
                  <div class="muted">This updates your profile username.</div>
                </div>
                <button class="xbtn" onclick="closeAllModals()">✕</button>
              </div>

              <div class="form-group">
                <label>New username</label>
                <input id="newUsername" type="text" value="${escapeHtml(currentUser.username)}">
              </div>

              <div class="btn-group">
                <button class="btn btn-ghost" onclick="closeAllModals()">Cancel</button>
                <button class="btn" onclick="saveUsername()">Save</button>
              </div>
            </div>
          </div>
        `;
      }

      if (changePassOpen){
        html += `
          <div class="modal-overlay" onclick="closeAllModals()">
            <div class="modal" onclick="event.stopPropagation()">
              <div class="modal-head">
                <div>
                  <div class="modal-title">Change password</div>
                  <div class="muted">You’ll use this new password next time you sign in.</div>
                </div>
                <button class="xbtn" onclick="closeAllModals()">✕</button>
              </div>

              <div class="form-group">
                <label>New password</label>
                <input id="newPass" type="password" placeholder="Min 6 characters">
              </div>
              <div class="form-group">
                <label>Confirm new password</label>
                <input id="newPass2" type="password" placeholder="Repeat password">
              </div>

              <div class="btn-group">
                <button class="btn btn-ghost" onclick="closeAllModals()">Cancel</button>
                <button class="btn" onclick="savePassword()">Update password</button>
              </div>
            </div>
          </div>
        `;
      }

      return html;
    }

    function renderChart(){
      const stats = getTimeStats();
      if (!stats.length) return;

      const canvas = document.getElementById('statsChart');
      if (!canvas) return;

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(canvas, {
        type:'pie',
        data:{
          labels: stats.map(s=>s.name),
          datasets:[{ data: stats.map(s=>s.hours), backgroundColor: stats.map(s=>s.color) }]
        },
        options:{
          responsive:true,
          maintainAspectRatio:true,
          plugins:{ legend:{ position:'bottom' } }
        }
      });
    }

    // ====== START ======
    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
