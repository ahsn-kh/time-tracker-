<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #1a202c;
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
        }

        h3 {
            color: #2d3748;
            margin-bottom: 15px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            background: #e2e8f0;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .activities-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .activity-card {
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            font-weight: 600;
            font-size: 13px;
            border: 3px solid transparent;
        }

        .activity-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .activity-card.selected {
            border-color: #1a202c;
            transform: scale(1.05);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 5px;
            font-size: 13px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #48bb78;
        }

        .btn-danger {
            background: #f56565;
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            margin-left: 5px;
        }

        .log-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f7fafc;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .log-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .log-details {
            font-size: 14px;
        }

        .log-time {
            color: #718096;
            font-size: 12px;
        }

        .finance-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 12px;
            background: #f7fafc;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .finance-info {
            flex: 1;
        }

        .finance-amount {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .finance-amount.income {
            color: #10b981;
        }

        .finance-amount.expense {
            color: #ef4444;
        }

        .finance-description {
            font-size: 13px;
            color: #718096;
            margin-bottom: 3px;
        }

        .finance-date {
            font-size: 12px;
            color: #a0aec0;
        }

        .chart-container {
            margin-top: 20px;
        }

        canvas {
            max-width: 100%;
            height: auto !important;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            padding: 15px;
            background: #f7fafc;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }

        .auth-container {
            max-width: 400px;
            margin: 50px auto;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .message.error {
            background: #fed7d7;
            color: #c53030;
        }

        .message.success {
            background: #c6f6d5;
            color: #2f855a;
        }

        .link-button {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
            background: none;
            border: none;
        }

        .user-info {
            text-align: center;
            color: #718096;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .activity-edit-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .activity-edit-row input[type="color"] {
            width: 60px;
            height: 40px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 0;
        }

        .activity-edit-row input[type="text"] {
            flex: 1;
        }

        @media (max-width: 640px) {
            .activities-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .input-row {
                grid-template-columns: 1fr;
            }

            .tabs {
                font-size: 12px;
            }

            .tab {
                padding: 10px 5px;
                min-width: 80px;
            }
        }
    </style>
</head>

    <script>

        const SUPABASE_URL = 'https://hvcqhlcaqocrqlyshzxm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2Y3FobGNhcW9jcnFseXNoenhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1NzcyNjcsImV4cCI6MjA4MzE1MzI2N30.E0VoHgQ6UevXqiYJyWtvYqBPwvmGbBw_jkzTlQMm4KQ';

        // Simple Supabase client
        class SupabaseClient {
            constructor(url, key) {
                this.url = url;
                this.key = key;
            }

            async query(table, method = 'GET', data = null, filter = null) {
                let url = `${this.url}/rest/v1/${table}`;

                if (filter) {
                    const params = new URLSearchParams(filter);
                    url += `?${params.toString()}`;
                }

                const options = {
                    method,
                    headers: {
                        'apikey': this.key,
                        'Authorization': `Bearer ${this.key}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    }
                };

                if (data) {
                    options.body = JSON.stringify(data);
                }

                const response = await fetch(url, options);

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const text = await response.text();
                if (!text || text.trim() === '') {
                    return method === 'DELETE' ? null : [];
                }

                try {
                    return JSON.parse(text);
                } catch (e) {
                    console.error('JSON parse error:', text);
                    throw new Error('Invalid JSON response from server');
                }
            }
        }

        const supabase = new SupabaseClient(SUPABASE_URL, SUPABASE_KEY);

        // Default activities
        const DEFAULT_ACTIVITIES = [
            { name: 'Work', color: '#3b82f6' },
            { name: 'Sleep', color: '#8b5cf6' },
            { name: 'Exercise', color: '#10b981' },
            { name: 'Study', color: '#f59e0b' },
            { name: 'Social', color: '#ec4899' },
            { name: 'Entertainment', color: '#06b6d4' },
            { name: 'Cooking', color: '#84cc16' },
            { name: 'Commute', color: '#6366f1' },
            { name: 'Chores', color: '#14b8a6' },
            { name: 'Reading', color: '#f97316' },
            { name: 'Hobbies', color: '#a855f7' },
            { name: 'Family', color: '#ef4444' },
            { name: 'Shopping', color: '#eab308' },
            { name: 'Health', color: '#22c55e' },
            { name: 'Other', color: '#64748b' }
        ];

        // App State
        let currentUser = null;
        let activities = [];
        let logs = [];
        let finances = [];
        let selectedActivity = null;
        let currentTab = 'log';
        let chartInstance = null;

        // Initialize app
        async function init() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = savedUser;
                try {
                    await loadActivities();
                    await loadLogs();
                    await loadFinances();
                    renderApp();
                } catch (error) {
                    console.error('Error loading data:', error);
                    localStorage.removeItem('currentUser');
                    renderAuth();
                }
            } else {
                renderAuth();
            }
        }

        // Authentication
        async function signUp(username, password) {
            if (!username || !password) {
                return { error: 'Username and password required' };
            }

            if (username.length < 3) {
                return { error: 'Username must be at least 3 characters' };
            }

            if (password.length < 4) {
                return { error: 'Password must be at least 4 characters' };
            }

            try {
                const existing = await supabase.query('activities', 'GET', null, {
                    user_id: `eq.${username}`,
                    select: 'user_id'
                });

                if (existing && existing.length > 0) {
                    return { error: 'Username already taken. Please choose another or sign in.' };
                }

                for (const activity of DEFAULT_ACTIVITIES) {
                    await supabase.query('activities', 'POST', {
                        user_id: username,
                        name: activity.name,
                        color: activity.color
                    });
                }

                localStorage.setItem('currentUser', username);
                localStorage.setItem(`pass_${username}`, password);
                currentUser = username;

                return { success: true };
            } catch (error) {
                console.error('Signup error:', error);
                return { error: 'Signup failed: ' + error.message };
            }
        }

        async function signIn(username, password) {
            if (!username || !password) {
                return { error: 'Username and password required' };
            }

            try {
                const existing = await supabase.query('activities', 'GET', null, {
                    user_id: `eq.${username}`,
                    select: 'user_id'
                });

                if (!existing || existing.length === 0) {
                    return { error: 'No account found. Please sign up first.' };
                }

                const savedPass = localStorage.getItem(`pass_${username}`);
                if (savedPass && savedPass !== password) {
                    return { error: 'Incorrect password' };
                }

                localStorage.setItem('currentUser', username);
                localStorage.setItem(`pass_${username}`, password);
                currentUser = username;

                return { success: true };
            } catch (error) {
                console.error('Signin error:', error);
                return { error: 'Sign in failed: ' + error.message };
            }
        }

        function signOut() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            activities = [];
            logs = [];
            finances = [];
            renderAuth();
        }

        // Data operations - Activities
        async function loadActivities() {
            activities = await supabase.query('activities', 'GET', null, {
                user_id: `eq.${currentUser}`
            });

            if (!activities || activities.length === 0) {
                for (const activity of DEFAULT_ACTIVITIES) {
                    await supabase.query('activities', 'POST', {
                        user_id: currentUser,
                        name: activity.name,
                        color: activity.color
                    });
                }
                activities = await supabase.query('activities', 'GET', null, {
                    user_id: `eq.${currentUser}`
                });
            }
        }

        async function loadLogs() {
            logs = await supabase.query('logs', 'GET', null, {
                user_id: `eq.${currentUser}`,
                order: 'log_date.desc,start_time.desc'
            }) || [];
        }

        async function addLog(activityName, activityColor, date, startTime, endTime) {
            const duration = calculateDuration(startTime, endTime);

            await supabase.query('logs', 'POST', {
                user_id: currentUser,
                activity_name: activityName,
                activity_color: activityColor,
                log_date: date,
                start_time: startTime,
                end_time: endTime,
                duration: duration
            });

            await loadLogs();
            renderApp();
        }

        async function deleteLog(logId) {
            await supabase.query(`logs?id=eq.${logId}`, 'DELETE');
            await loadLogs();
            renderApp();
        }

        async function updateActivity(activityId, name, color) {
            try {
                await supabase.query(`activities?id=eq.${activityId}`, 'PATCH', {
                    name: name,
                    color: color
                });
                await loadActivities();
                alert('Activity updated successfully!');
                renderApp();
            } catch (error) {
                alert('Error updating activity: ' + error.message);
            }
        }

        async function addNewActivity() {
            const name = prompt('Enter activity name:');
            if (!name) return;

            const color = '#' + Math.floor(Math.random()*16777215).toString(16);

            try {
                await supabase.query('activities', 'POST', {
                    user_id: currentUser,
                    name: name,
                    color: color
                });
                await loadActivities();
                alert('Activity added successfully!');
                renderApp();
            } catch (error) {
                alert('Error adding activity: ' + error.message);
            }
        }

        async function deleteActivity(activityId) {
            if (!confirm('Delete this activity? This cannot be undone.')) return;

            try {
                await supabase.query(`activities?id=eq.${activityId}`, 'DELETE');
                await loadActivities();
                alert('Activity deleted successfully!');
                renderApp();
            } catch (error) {
                alert('Error deleting activity: ' + error.message);
            }
        }

        // Data operations - Finances
        async function loadFinances() {
            try {
                finances = await supabase.query('finances', 'GET', null, {
                    user_id: `eq.${currentUser}`,
                    order: 'date.desc,created_at.desc'
                }) || [];
            } catch (error) {
                console.error('Error loading finances:', error);
                finances = [];
            }
        }

        async function addFinance(type, amount, description, date) {
            await supabase.query('finances', 'POST', {
                user_id: currentUser,
                type: type,
                amount: parseFloat(amount),
                description: description,
                date: date
            });

            await loadFinances();
            renderApp();
        }

        async function deleteFinance(financeId) {
            try {
                await supabase.query(`finances?id=eq.${financeId}`, 'DELETE');
                await loadFinances();
                renderApp();
            } catch (error) {
                alert('Error deleting entry: ' + error.message);
            }
        }

        // Helper functions
        function calculateDuration(startTime, endTime) {
            const [startH, startM] = startTime.split(':').map(Number);
            const [endH, endM] = endTime.split(':').map(Number);
            let duration = (endH * 60 + endM) - (startH * 60 + startM);
            if (duration < 0) duration += 24 * 60;
            return (duration / 60).toFixed(2);
        }

        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        function getCurrentTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        function getStats() {
            const activityTotals = {};
            logs.forEach(log => {
                activityTotals[log.activity_name] = (activityTotals[log.activity_name] || 0) + parseFloat(log.duration);
            });

            return Object.entries(activityTotals)
                .map(([name, hours]) => ({
                    name,
                    hours: parseFloat(hours.toFixed(1)),
                    color: logs.find(l => l.activity_name === name)?.activity_color || '#64748b'
                }))
                .sort((a, b) => b.hours - a.hours);
        }

        function getFinanceStats() {
            let totalIncome = 0;
            let totalExpense = 0;

            finances.forEach(f => {
                if (f.type === 'income') totalIncome += parseFloat(f.amount);
                else totalExpense += parseFloat(f.amount);
            });

            return {
                totalIncome,
                totalExpense,
                balance: totalIncome - totalExpense
            };
        }

        function exportCSV() {
            let csv = 'Date,Activity,Start Time,End Time,Duration (hours)\n';
            logs.forEach(log => {
                csv += `${log.log_date},${log.activity_name},${log.start_time},${log.end_time},${log.duration}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `time-tracker-${currentUser}-${getTodayString()}.csv`;
            a.click();
        }

        function exportFinanceCSV() {
            let csv = 'Date,Type,Amount,Description\n';
            finances.forEach(f => {
                csv += `${f.date},${f.type},${f.amount},"${f.description || ''}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `finances-${currentUser}-${getTodayString()}.csv`;
            a.click();
        }

        function showSignUpForm() {
            document.getElementById('authForm').innerHTML = `
                <div class="form-group">
                    <label>Choose Username</label>
                    <input type="text" id="username" placeholder="Create a username" autocomplete="username">

                <div class="form-group">

        async function handleSignIn() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const result = await signIn(username, password);

            if (result.error) {

                await loadLogs();
                await loadFinances();
                renderApp();

        async function handleSignUp() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const result = await signUp(username, password);

            if (result.error) {
                document.getElementById('authMessage').innerHTML =

        function renderApp() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="card">
                    <h1>⏰ Time Tracker</h1>
                    <div class="user-info">Logged in as: <strong>${currentUser}</strong></div>
                    <div class="tabs">
                        <button class="tab ${currentTab === 'log' ? 'active' : ''}" onclick="switchTab('log')">Time</button>
                        <button class="tab ${currentTab === 'finance' ? 'active' : ''}" onclick="switchTab('finance')">Finance</button>
                        <button class="tab ${currentTab === 'stats' ? 'active' : ''}" onclick="switchTab('stats')">Stats</button>
                        <button class="tab ${currentTab === 'settings' ? 'active' : ''}" onclick="switchTab('settings')">Settings</button>
                    </div>

                    <div id="logSection" class="section ${currentTab === 'log' ? 'active' : ''}">
                        ${renderLogSection()}
                    </div>

                    <div id="financeSection" class="section ${currentTab === 'finance' ? 'active' : ''}">
                        ${renderFinanceSection()}
                    </div>

                    <div id="statsSection" class="section ${currentTab === 'stats' ? 'active' : ''}">
                        ${renderStatsSection()}
                    </div>

                    <div id="settingsSection" class="section ${currentTab === 'settings' ? 'active' : ''}">
                        ${renderSettingsSection()}

                </div>
            `;

            if (currentTab === 'stats') {
                setTimeout(renderChart, 100);

        function renderLogSection() {
            const todayLogs = logs.filter(log => log.log_date === getTodayString());

            return `
                <div class="form-group">
                    <label>Select Activity</label>
                    <div class="activities-grid">
                        ${activities.map(activity => `
                            <div class="activity-card ${selectedActivity?.id === activity.id ? 'selected' : ''}"

                                 onclick="selectActivity(${activity.id})">
                                ${activity.name}
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="logDate" value="${getTodayString()}">
                </div>

                <div class="input-row">
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" id="startTime" value="${getCurrentTime()}">
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" id="endTime" value="${getCurrentTime()}">
                    </div>
                </div>

                <button class="btn" onclick="handleAddLog()">Add Log</button>

                <div style="margin-top: 30px;">
                    <h3 style="margin-bottom: 15px;">Today's Logs</h3>
                    ${todayLogs.length > 0 ? todayLogs.map(log => `
                        <div class="log-item">
                            <div class="log-info">
                                <div class="color-dot" style="background: ${log.activity_color}"></div>
                                <div>
                                    <div class="log-details"><strong>${log.activity_name}</strong></div>
                                    <div class="log-time">${log.start_time} - ${log.end_time} (${log.duration}h)</div>
                                </div>
                            </div>
                            <button class="btn btn-danger" onclick="deleteLog(${log.id})">Delete</button>
                        </div>
                    `).join('') : '<p style="text-align: center; color: #718096;">No logs for today. Start tracking!</p>'}
                </div>
            `;
        }

        function renderFinanceSection() {
            const stats = getFinanceStats();

            return `
                <div class="stats-summary" style="margin-bottom: 25px;">
                    <div class="stat-card">
                        <div class="stat-value" style="color: #10b981;">₹${stats.totalIncome.toFixed(2)}</div>
                        <div class="stat-label">Total Income</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color: #ef4444;">₹${stats.totalExpense.toFixed(2)}</div>
                        <div class="stat-label">Total Expenses</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color: ${stats.balance >= 0 ? '#10b981' : '#ef4444'};">₹${stats.balance.toFixed(2)}</div>
                        <div class="stat-label">Balance</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Type</label>
                    <select id="financeType">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="financeAmount" placeholder="Enter amount" step="0.01" min="0">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="financeDescription" placeholder="Enter description (optional)"></textarea>
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="financeDate" value="${getTodayString()}">
                </div>

                <button class="btn" onclick="handleAddFinance()">Add Entry</button>

                <div style="margin-top: 30px;">
                    <h3>Recent Entries</h3>
                    ${finances.length > 0 ? finances.slice(0, 10).map(f => `
                        <div class="finance-item">
                            <div class="finance-info">
                                <div class="finance-amount ${f.type}">${f.type === 'income' ? '+' : '-'}₹${parseFloat(f.amount).toFixed(2)}</div>
                                <div class="finance-description">${f.description || 'No description'}</div>
                                <div class="finance-date">${f.date}</div>
                            </div>
                            <button class="btn btn-danger" onclick="deleteFinance(${f.id})">Delete</button>
                        </div>
                    `).join('') : '<p style="text-align: center; color: #718096;">No entries yet. Start tracking!</p>'}
                </div>
            `;
        }

        function renderStatsSection() {
            const stats = getStats();
            const totalHours = stats.reduce((sum, s) => sum + s.hours, 0);
            const financeStats = getFinanceStats();

            return `
                <h3>Time Statistics</h3>
                <div class="stats-summary">
                    <div class="stat-card">
                        <div class="stat-value">${logs.length}</div>
                        <div class="stat-label">Total Entries</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${totalHours.toFixed(1)}h</div>
                        <div class="stat-label">Total Hours</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${activities.length}</div>
                        <div class="stat-label">Activities</div>
                    </div>
                </div>

                <button class="btn btn-secondary" onclick="exportCSV()" style="margin-bottom: 20px;">Export Time Data</button>

                ${stats.length > 0 ? `
                    <div class="chart-container">
                        <canvas id="statsChart"></canvas>
                    </div>

                    <div style="margin-top: 20px;">
                        <h3 style="margin-bottom: 15px;">Time Breakdown</h3>
                        ${stats.map(stat => `
                            <div class="log-item">
                                <div class="log-info">
                                    <div class="color-dot" style="background: ${stat.color}"></div>
                                    <div class="log-details"><strong>${stat.name}</strong></div>
                                </div>
                                <div style="font-weight: bold;">${stat.hours}h</div>
                            </div>
                        `).join('')}
                    </div>
                ` : '<p style="text-align: center; color: #718096; margin-top: 20px;">No data yet. Start logging to see statistics!</p>'}

                <h3 style="margin-top: 40px;">Finance Statistics</h3>
                <div class="stats-summary">
                    <div class="stat-card">
                        <div class="stat-value" style="color: #10b981;">₹${financeStats.totalIncome.toFixed(2)}</div>
                        <div class="stat-label">Total Income</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color: #ef4444;">₹${financeStats.totalExpense.toFixed(2)}</div>
                        <div class="stat-label">Total Expenses</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color: ${financeStats.balance >= 0 ? '#10b981' : '#ef4444'};">₹${financeStats.balance.toFixed(2)}</div>
                        <div class="stat-label">Balance</div>
                    </div>
                </div>

                <button class="btn btn-secondary" onclick="exportFinanceCSV()">Export Finance Data</button>
            `;
        }

        function renderSettingsSection() {
            return `
                <div style="margin-bottom: 30px;">
                    <h3 style="margin-bottom: 15px;">Customize Activities</h3>
                    <p style="color: #718096; font-size: 13px; margin-bottom: 15px;">
                        Change colors and names of your activities. Changes save automatically.
                    </p>
                    ${activities.map(activity => `
                        <div class="activity-edit-row">
                            <input type="color" value="${activity.color}"
                                   id="color_${activity.id}"
                                   onchange="updateActivityField(${activity.id})">
                            <input type="text" value="${activity.name}"
                                   id="name_${activity.id}"
                                   onchange="updateActivityField(${activity.id})">
                            <button class="btn btn-danger btn-small" onclick="deleteActivity(${activity.id})">Delete</button>
                        </div>
                    `).join('')}
                    <button class="btn btn-secondary" onclick="addNewActivity()" style="margin-top: 15px;">+ Add New Activity</button>
                </div>

                <button class="btn btn-danger" onclick="if(confirm('Are you sure you want to sign out?')) signOut()">
                    Sign Out
                </button>
            `;
        }

        function renderChart() {
            const stats = getStats();
            if (stats.length === 0) return;

            const ctx = document.getElementById('statsChart');
            if (!ctx) return;

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: stats.map(s => s.name),
                    datasets: [{
                        data: stats.map(s => s.hours),
                        backgroundColor: stats.map(s => s.color)
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            renderApp();
        }

        function selectActivity(activityId) {
            selectedActivity = activities.find(a => a.id === activityId);
            renderApp();
        }

        async function handleAddLog() {
            if (!selectedActivity) {
                alert('Please select an activity first');
                return;
            }

            const date = document.getElementById('logDate').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            if (!startTime || !endTime) {
                alert('Please enter start and end times');
                return;
            }

            try {
                await addLog(selectedActivity.name, selectedActivity.color, date, startTime, endTime);
            } catch (error) {
                alert('Error adding log: ' + error.message);
            }
        }

        async function handleAddFinance() {
            const type = document.getElementById('financeType').value;
            const amount = document.getElementById('financeAmount').value;
            const description = document.getElementById('financeDescription').value;
            const date = document.getElementById('financeDate').value;

            if (!amount || parseFloat(amount) <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            try {
                await addFinance(type, amount, description, date);
                document.getElementById('financeAmount').value = '';
                document.getElementById('financeDescription').value = '';
            } catch (error) {
                alert('Error adding finance entry: ' + error.message);
            }
        }

        async function updateActivityField(activityId) {
            const name = document.getElementById(`name_${activityId}`).value;
            const color = document.getElementById(`color_${activityId}`).value;

            if (!name) {
                alert('Activity name cannot be empty');
                return;
            }

            await updateActivity(activityId, name, color);
        }

        // Start the app
        init();
    </script>
</body>
</html>
